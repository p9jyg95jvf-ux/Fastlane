name: IPA neu signieren

on:
  workflow_dispatch:
    inputs:
      ipa:
        description: "IPA: Pfad im Repo oder Download-URL"
        default: "input/app.ipa"
      profile:
        description: "Provisioning Profile(s): Pfad/Glob oder URL, mehrere mit Komma"
        default: "input/*.mobileprovision"
      bundle_id:
        description: "Neue Bundle-ID (optional, sonst aus dem Profil)"
        required: false
      display_name:
        description: "Neuer App-Name (optional)"
        required: false
      version:
        description: "Neue Versionsnummer (optional)"
        required: false
      release:
        description: "Signierte IPA zusaetzlich als GitHub Release veroeffentlichen"
        type: boolean
        default: false
  # Automatisch, sobald eine IPA oder ein Profil in input/ hochgeladen wird
  push:
    paths:
      - "input/*.ipa"
      - "input/*.mobileprovision"

permissions:
  contents: write

jobs:
  resign:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Eingaben bereitstellen
        env:
          IPA_SRC: ${{ inputs.ipa }}
          PROFILE_SRC: ${{ inputs.profile }}
          P12_BASE64: ${{ secrets.P12_BASE64 }}
        run: ./scripts/fetch_inputs.sh

      - name: IPA neu signieren (fastlane)
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          APP_VERSION: ${{ inputs.version }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_TIMESTAMP: "1"
        run: bundle exec fastlane resign_ipa

      - name: Zusammenfassung
        run: |
          {
            echo "### Signierte IPA"
            echo "\`$(basename "$OUT_IPA")\` ($(du -h "$OUT_IPA" | cut -f1))"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: resigned-ipa
          path: out/*.ipa
          compression-level: 0
          retention-days: 14

      - name: GitHub Release erstellen
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "resigned-${{ github.run_number }}" "$OUT_IPA" \
            --title "Signierte IPA #${{ github.run_number }}" \
            --notes "Neu signiert mit fastlane (Run ${{ github.run_id }})."

      - name: Keychain aufraeumen
        if: always()
        run: |
          security delete-keychain resign-tool.keychain-db 2>/dev/null || \
          security delete-keychain resign-tool 2>/dev/null || true
          rm -rf work
